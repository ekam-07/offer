    recent_abandon: 0.0
    opt_in: 0.95
    review_rate: 0.25
    follow_rate: 0.02
    promo_click_rate: 0.03
    plus_member: 0.5
  deal_seeker:
    weight: 0.17
    tenure_days: [200, 900]
    order_gap_days: [14, 30]
    aov_inr: [700, 1500]
    coupon_rate: [0.6, 0.9]
    sessions_per_week: [3, 8]
    abandon_rate: 0.12
    recent_abandon: 0.0
    opt_in: 0.95
    search_rate: 0.6
    promo_click_rate: 0.35
    promo_view_rate: 0.5
    return_rate_mult: 1.2
    plus_member: 0.3
  at_risk:
    weight: 0.12
    tenure_days: [250, 900]
    order_gap_days: [10, 22]
    stop_gap_mult: [2.0, 4.0]
