# Stock levels (R25: out-of-stock products are never promoted; overstock can be pushed).
stock:
  out_of_stock_share: 0.08
  overstock_share: 0.10
  normal_units: [20, 300]
  overstock_units: [600, 1500]

# Recent price drops and restocks (for the wishlist watcher). Own random stream, so the rest
# of the catalog and all orders stay the same. The price stored is the NEW price.
price_changes:
  window_days: 7            # changes in the last week before the data's "now"
  drop_share: 0.12          # share of in-stock products whose price dropped
  drop_pct: [10, 30]        # how much it dropped
  restock_share: 0.06       # share of in-stock products that came back in stock

# Festivals: browsing rises in the days before (event stream and the 30-day simulation).
# Order history is NOT changed, so earlier evaluation results stay reproducible.
festivals:
  - {name: Diwali, date: "2025-10-21", boost_days_before: 14, browsing_boost: 1.6, purchase_boost: 1.4}
  - {name: Diwali, date: "2026-11-08", boost_days_before: 14, browsing_boost: 1.6, purchase_boost: 1.4}

# Store-wide campaigns over the year. Coupons used in orders are linked to these.
promotions:
  every_days: 14            # a new campaign starts every N days
  plan_ahead_days: 60       # campaigns already planned after today
  duration_days: [3, 7]
  types:                    # [offer type, value, applies to]
    - [PERCENT_OFF, 10, all]
    - [PERCENT_OFF, 15, category]
    - [FLAT_OFF, 100, all]
    - [FLAT_OFF, 200, category]
    - [FREE_SHIPPING, 0, all]
    - [CATEGORY_DEAL, 20, category]
