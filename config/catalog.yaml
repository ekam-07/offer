# Product catalog and store promotions used by the event generator.
# Brands are fictional on purpose, so the synthetic data can't be mistaken for real brand data.
#
# items: [product type, category_l2, base price in INR]
# Each product = one brand x one product type; its price = base price x a brand price factor.

brands_per_item: 3          # how many brands sell each product type
brand_price_factor: [0.8, 1.4]
rating_range: [3.2, 4.8]

brands:
  Fashion: [UrbanThread, Desi Loom, StrideMax, Velvet Lane]
  Electronics: [VoltEdge, SoundNest, Pixelon, ChargeUp]
  Mobiles: [Nova Mobile, Zentro, ClipCase, PowerPod]
  Home: [CasaCraft, HomeNest, BrewWell, PureFlow]
  Beauty: [GlowLeaf, Aurae, SilkRoot, SunVeil]
  Books: [PageTurn Press, Inkwell, Lotus Books, CodeCraft]
  Grocery: [FarmFresh, Annapurna Foods, LeafTea, GoldDrop]

items:
  Fashion:
    - [Denim Jacket, Outerwear, 1800]
    - [Running Shoes, Footwear, 2500]
    - [Cotton Kurta, Ethnic Wear, 900]
    - [Leather Handbag, Bags, 2200]
    - [Graphic T-Shirt, Topwear, 500]
  Electronics:
    - [Noise Cancelling Headphones, Audio, 3500]
    - [Smart Watch, Wearables, 4000]
    - [Bluetooth Speaker, Audio, 1800]
    - [Power Bank, Accessories, 1200]
    - [Wireless Mouse, Computer Accessories, 700]
  Mobiles:
    - [Smartphone 5G, Phones, 15000]
